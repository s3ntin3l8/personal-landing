version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    ignore:
      # @astrojs/check (and @volar/kit) support TypeScript 5 and 6 only.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      npm-deps:
        patterns:
          - '*'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns:
          - '*'
