version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    ignore:
      # @astrojs/check's peer range is ^5 || ^6 and TS 7 ships no lib/typescript.js.
      # Remove once @astrojs/check accepts TS 7 (#22).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      npm-deps:
        patterns:
          - '*'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns:
          - '*'
