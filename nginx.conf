server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_vary on;

  # nginx drops inherited add_header directives as soon as a location sets its own,
  # so every location includes the shared security headers explicitly.
  include /etc/nginx/security-headers.conf;

  # Astro emits content-hashed files under /_astro/: cache them forever.
  location /_astro/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;
}
